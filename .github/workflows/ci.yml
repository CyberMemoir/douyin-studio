name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-frontier:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -X utf8 tests/test_douyin_frontier.py
      - run: python -X utf8 tests/test_native_frontier.py
      - run: python -X utf8 tests/native_acceptance.py --output "${{ runner.temp }}/douyin-native-acceptance"
      - run: python -X utf8 tests/frontier_acceptance.py --output "${{ runner.temp }}/douyin-frontier-acceptance"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
